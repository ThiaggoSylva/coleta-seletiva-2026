name: Deploy MonsterASP.NET

# Publicação manual: nenhum deploy acontece sem uma execução explícita.
# Para publicar a cada push na main, acrescente:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      rid:
        description: 'Runtime de publicação (win-x86 é o padrão da hospedagem)'
        required: false
        default: win-x86

permissions:
  contents: read

concurrency:
  group: deploy-monsterasp
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NODE_VERSION: "24.21.0"

jobs:
  publicar:
    name: Compilar, testar e publicar
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: app/backend/global.json
          cache: true
          cache-dependency-path: app/backend/**/packages.lock.json

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar e compilar a SPA
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Copiar a SPA para wwwroot da API
        shell: bash
        run: |
          destino="app/backend/src/ColetaSeletiva.Api/wwwroot"
          rm -rf "$destino"
          mkdir -p "$destino"
          cp -R "app/frontend/dist/frontend/browser/." "$destino/"

      - name: Testes unitários
        working-directory: app/backend
        run: |
          dotnet test tests/ColetaSeletiva.Domain.Tests/ColetaSeletiva.Domain.Tests.csproj --configuration Release
          dotnet test tests/ColetaSeletiva.Application.Tests/ColetaSeletiva.Application.Tests.csproj --configuration Release

      - name: Publicar a API
        working-directory: app/backend
        run: >
          dotnet publish src/ColetaSeletiva.Api/ColetaSeletiva.Api.csproj
          --configuration Release
          --runtime ${{ inputs.rid }}
          --self-contained false
          --output ./publish

      - name: Enviar para o MonsterASP.NET (Web Deploy)
        uses: rasmusbuchholdt/simply-web-deploy@026998dd5857dd5f3645cc13ed48335e07d7f94b # 2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
